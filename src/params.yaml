# Column names to look for — normalized to lowercase by the script.
# Covers both Chase formats:
#   Chase1600:       Details, Posting Date, Description, Amount, Type, Balance
#   Chase4488/5650:  Transaction Date, Post Date, Description, Category, Type, Amount, Memo
possible_columns:
  - details
  - posting date
  - transaction date
  - post date
  - description
  - amount
  - type
  - balance
  - category
  - memo
